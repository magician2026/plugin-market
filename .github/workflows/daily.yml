name: Auto Fetch Plugin Data

on:
  schedule:
    # UTC 时间，北京时间减 8 小时
    - cron: '0 1 * * *'    # 北京时间 09:00
    - cron: '0 5 * * *'    # 北京时间 13:00
    - cron: '0 9 * * *'    # 北京时间 17:00
    - cron: '0 13 * * *'   # 北京时间 21:00
  workflow_dispatch:        # 也允许手动触发

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py

      - name: Commit and push
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update $(date -u +%Y-%m-%d_%H:%M)"
          git push
