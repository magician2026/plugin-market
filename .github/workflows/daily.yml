name: Daily Plugin Fetch

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch.py

      - name: Commit and push
        run: |
          git config user.name "auto-bot"
          git config user.email "bot@users.noreply.github.com"
          git add market_data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "auto update $(date -u +%Y-%m-%d)"
          git push
